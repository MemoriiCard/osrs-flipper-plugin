name: Tester release

# Builds the tester client with the beta server baked in and publishes it as a GitHub release.
# Set the repository variable FLIPPER_SERVER_URL (Settings > Secrets and variables > Actions > Variables)
# to the beta server, e.g. https://gpgenius.gg. Run it from the Actions tab, or push a tag like v0.5.1.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the server address is set
        env:
          SERVER_URL: ${{ vars.FLIPPER_SERVER_URL }}
        run: |
          case "$SERVER_URL" in
            https://*) echo "Building for $SERVER_URL" ;;
            *) echo "::error::Set the FLIPPER_SERVER_URL repository variable to your https:// server address first."; exit 1 ;;
          esac
      - name: Test and build the tester client
        run: ./gradlew build shadowJar --no-daemon -PserverUrl="${{ vars.FLIPPER_SERVER_URL }}"
      - name: Package
        run: |
          VERSION=$(grep "^version" build.gradle | cut -d"'" -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist/GP-Genius-Beta
          cp build/libs/*-all.jar dist/GP-Genius-Beta/gp-genius-beta.jar
          cp "packaging/Start GP Genius Beta.bat" packaging/README.txt dist/GP-Genius-Beta/
          (cd dist && zip -qr GP-Genius-Beta-Windows.zip GP-Genius-Beta)
          cp dist/GP-Genius-Beta/gp-genius-beta.jar dist/gp-genius-beta.jar
          (cd dist && sha256sum GP-Genius-Beta-Windows.zip gp-genius-beta.jar > SHA256SUMS.txt)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then TAG="beta-${VERSION}-${GITHUB_RUN_NUMBER}"; fi
          {
            echo "Tester build for ${{ vars.FLIPPER_SERVER_URL }}."
            echo
            echo "Windows: download GP-Genius-Beta-Windows.zip, unzip, double-click Start GP Genius Beta."
            echo "Mac/Linux: download gp-genius-beta.jar and run: java -ea -jar gp-genius-beta.jar"
            echo
            echo "SHA-256:"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "GP Genius beta ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md dist/GP-Genius-Beta-Windows.zip dist/gp-genius-beta.jar dist/SHA256SUMS.txt
