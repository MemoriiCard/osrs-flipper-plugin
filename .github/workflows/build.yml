name: Build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published vulnerability in a dependency shows up without a code change.
    - cron: '23 6 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        # xvfb gives the panel click-through tests (PanelClickThroughTest) a display to draw on.
        run: xvfb-run -a ./gradlew build --no-daemon
      - name: Build the tester jar
        run: ./gradlew shadowJar --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gp-genius-tester-jar
          path: build/libs/*-all.jar
          retention-days: 30

  dependency-scan:
    # Checks every resolved dependency (build, test and the RuneLite client itself) against the OSV
    # vulnerability database. Gradle writes the exact versions to a lockfile for the scan; the lockfile
    # isn't committed, so the Plugin Hub build is unchanged. Most of the tree is the RuneLite client's own
    # libraries (Guava, OkHttp, Gson...), which RuneLite updates and the plugin can't change: those are
    # listed in the run's summary as warnings. The job fails only for what build.gradle names itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
      - name: Write the exact dependency versions
        run: |
          init="$RUNNER_TEMP/lock.gradle"
          echo 'allprojects { dependencyLocking { lockAllConfigurations(); lockMode = org.gradle.api.artifacts.dsl.LockMode.LENIENT } }' > "$init"
          ./gradlew -I "$init" dependencies --write-locks --no-daemon -q > /dev/null
          test -s gradle.lockfile
          grep -c '=' gradle.lockfile
      - name: Check them against OSV
        env:
          OSV_VERSION: v2.2.3
        run: |
          base="https://github.com/google/osv-scanner/releases/download/$OSV_VERSION"
          curl -sSfL -o osv-scanner_linux_amd64 "$base/osv-scanner_linux_amd64"
          curl -sSfL -o sums "$base/osv-scanner_SHA256SUMS"
          grep ' osv-scanner_linux_amd64$' sums | sha256sum -c -
          chmod +x osv-scanner_linux_amd64
          rc=0
          ./osv-scanner_linux_amd64 scan source --lockfile=gradle.lockfile > osv.txt 2>&1 || rc=$?
          cat osv.txt
          { echo '### Dependency scan (OSV)'; echo '```'; cat osv.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # 0: nothing found, 1: findings. Anything else means the scan itself didn't work.
          [ "$rc" -le 1 ] || { echo "::error::osv-scanner failed (exit $rc)"; exit 1; }
          if grep -E '\| (org\.projectlombok:lombok|junit:junit|org\.hamcrest:hamcrest-core) ' osv.txt; then
            echo "::error::A dependency build.gradle names has a known vulnerability: bump it."; exit 1
          fi
          [ "$rc" -eq 0 ] || echo "::warning::Findings above are in RuneLite's own libraries; RuneLite updates those."
